<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Stop Reconciliation</title>
<style>
:root{
  --bar:#0f2540;--bar2:#16345a;--line:#2a4a75;--accent:#4da3ff;
  --text:#e8f0fa;--mute:#9db6d3;--bg:#eef2f7;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);display:flex;flex-direction:row;overflow:hidden}

.side{width:210px;flex-shrink:0;background:var(--bar);color:var(--text);display:flex;flex-direction:column;
  box-shadow:2px 0 8px rgba(0,0,0,.3);z-index:10}
.brand{padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--mute);margin-top:2px}

.tabs{display:flex;flex-direction:column;gap:3px;padding:12px 0 12px 10px;overflow-y:auto;flex:1}
.tab{appearance:none;border:1px solid transparent;border-right:none;background:transparent;
  color:var(--mute);font:inherit;cursor:pointer;padding:10px 16px;border-radius:8px 0 0 8px;
  text-align:left;transition:background .15s,color .15s}
.tab:hover{background:var(--bar2);color:var(--text)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tab .t{display:block;font-size:13px;font-weight:700}
.tab .d{display:block;font-size:10px;opacity:.8;margin-top:1px}
.tab[aria-selected="true"]{background:var(--bg);color:#0f2540;border-color:var(--bg)}
.tab[aria-selected="true"] .d{opacity:.7}

.stage{flex:1;position:relative;min-width:0}
.pane{position:absolute;inset:0;display:none;background:var(--bg)}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#5a6a7a;font-size:13px;pointer-events:none}

@media(max-width:700px){
  .side{width:64px}
  .brand{padding:12px 6px;text-align:center}
  .brand h1{font-size:10px;letter-spacing:0}
  .brand .sub,.tab .d{display:none}
  .tabs{padding:8px 0 8px 6px}
  .tab{padding:10px 6px;text-align:center}
  .tab .t{font-size:11px}
}
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <h1>One Stop Reconciliation</h1>
    <div class="sub">Finance reconciliation platform</div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Reconciliations" id="tabs"></nav>
</aside>

<main class="stage" id="stage"></main>

<!-- Each reconciliation tool is embedded UNMODIFIED as a JSON string and mounted in its own iframe.
     Isolation guarantees the tool's logic, rules, styles and file handling behave exactly as standalone. -->
<script id="modules-data" type="application/json">/*__MODULES__*/</script>

<script>
(function(){
  var MODS = JSON.parse(document.getElementById('modules-data').textContent);
  var tabsEl = document.getElementById('tabs'), stage = document.getElementById('stage');
  var panes = {}, tabBtns = {};

  MODS.forEach(function(m){
    var b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.id = 'tab-' + m.id;
    b.setAttribute('role','tab'); b.setAttribute('aria-selected','false');
    b.setAttribute('aria-controls','pane-' + m.id);
    b.innerHTML = '<span class="t"></span><span class="d"></span>';
    b.querySelector('.t').textContent = m.label;
    b.querySelector('.d').textContent = m.desc;
    b.addEventListener('click', function(){ activate(m.id, true); });
    b.addEventListener('keydown', function(e){
      var i = MODS.findIndex(function(x){return x.id===m.id;}), n = null;
      if (e.key==='ArrowRight') n = MODS[(i+1)%MODS.length];
      else if (e.key==='ArrowLeft') n = MODS[(i-1+MODS.length)%MODS.length];
      if (n){ e.preventDefault(); activate(n.id, true); tabBtns[n.id].focus(); }
    });
    tabsEl.appendChild(b); tabBtns[m.id] = b;

    var p = document.createElement('section');
    p.className = 'pane'; p.id = 'pane-' + m.id;
    p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-' + m.id);
    stage.appendChild(p); panes[m.id] = p;
  });

  // The iframe is created the first time its tab is opened, then kept alive (hidden, not destroyed)
  // so uploaded files and results survive switching between tabs.
  function mount(m){
    var p = panes[m.id];
    if (p.firstChild) return;
    var ld = document.createElement('div'); ld.className = 'loading'; ld.textContent = 'Loading ' + m.label + '…';
    p.appendChild(ld);
    var f = document.createElement('iframe');
    f.title = m.label + ' reconciliation';
    f.addEventListener('load', function(){ if (ld.parentNode) ld.parentNode.removeChild(ld); });
    f.srcdoc = m.html;
    p.appendChild(f);
  }

  function activate(id, push){
    var m = MODS.find(function(x){return x.id===id;}) || MODS[0];
    MODS.forEach(function(x){
      var on = x.id === m.id;
      panes[x.id].classList.toggle('active', on);
      tabBtns[x.id].setAttribute('aria-selected', on ? 'true' : 'false');
      tabBtns[x.id].tabIndex = on ? 0 : -1;
    });
    mount(m);
    document.title = m.label + ' · One Stop Reconciliation';
    if (push && location.hash !== '#' + m.id) history.replaceState(null,'','#' + m.id);
  }

  window.addEventListener('hashchange', function(){ activate(location.hash.slice(1), false); });
  activate(location.hash.slice(1), false);
})();
</script>
</body>
</html>
