<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Stop Reconciliation</title>
<style>
:root{
  --bar:#0f2540;--bar2:#16345a;--line:#2a4a75;--accent:#4da3ff;
  --text:#e8f0fa;--mute:#9db6d3;--bg:#eef2f7;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);display:flex;flex-direction:row;overflow:hidden}

.side{width:210px;flex-shrink:0;background:var(--bar);color:var(--text);display:flex;flex-direction:column;
  box-shadow:2px 0 8px rgba(0,0,0,.3);z-index:10}
.brand{padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--mute);margin-top:2px}

.tabs{display:flex;flex-direction:column;gap:3px;padding:12px 0 12px 10px;overflow-y:auto;flex:1}
.tab{appearance:none;border:1px solid transparent;border-right:none;background:transparent;
  color:var(--mute);font:inherit;cursor:pointer;padding:10px 16px;border-radius:8px 0 0 8px;
  text-align:left;transition:background .15s,color .15s}
.tab:hover{background:var(--bar2);color:var(--text)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tab .t{display:block;font-size:13px;font-weight:700}
.tab .d{display:block;font-size:10px;opacity:.8;margin-top:1px}
.tab[aria-selected="true"]{background:var(--bg);color:#0f2540;border-color:var(--bg)}
.tab[aria-selected="true"] .d{opacity:.7}

.stage{flex:1;position:relative;min-width:0}
.pane{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.pane.active{display:flex}
.pane iframe{flex:1;min-height:0;width:100%;border:0;display:block;background:var(--bg)}
.pbar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-bottom:1px solid #d5deea}
.pbar .pt{font-size:12px;font-weight:700;color:#0f2540;margin-right:auto}
.ib{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid #c5d3e6;background:#f4f8fd;color:#1b4b82;
  font:inherit;font-size:12px;font-weight:600;padding:5px 11px 5px 8px;border-radius:16px;cursor:pointer;transition:background .15s,border-color .15s}
.ib:hover{background:#e3eefb;border-color:#4da3ff}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ib svg{width:16px;height:16px;flex-shrink:0}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#5a6a7a;font-size:13px;pointer-events:none}

dialog.help{margin:auto;border:none;border-radius:12px;padding:0;width:min(760px,94vw);max-height:86vh;color:#1a2433;
  box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
dialog.help[open]{display:flex;flex-direction:column}
dialog.help::backdrop{background:rgba(10,25,45,.55)}
.hh{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--bar);color:#fff}
.hh h2{font-size:15px;font-weight:700;margin-right:auto}
.hh .x{appearance:none;border:none;background:transparent;color:#cfe0f5;font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.hh .x:hover{color:#fff}
.hb{padding:6px 20px 20px;overflow-y:auto;font-size:13px;line-height:1.55}
.hb h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#1b4b82;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid #dbe5f2}
.hb p{margin:6px 0}
.hb ul,.hb ol{margin:6px 0 6px 20px}
.hb li{margin:3px 0}
.hb code{background:#eef2f7;border:1px solid #dbe3ee;border-radius:4px;padding:0 5px;font-size:11.5px;font-family:Consolas,'Courier New',monospace}
.hb table.rt{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.hb table.rt th,.hb table.rt td{border:1px solid #d5deea;padding:6px 9px;text-align:left;vertical-align:top}
.hb table.rt th{background:#eef3fa;color:#0f2540}

@media(max-width:700px){
  .ib span{display:none}
  .ib{padding:6px}
  .side{width:64px}
  .brand{padding:12px 6px;text-align:center}
  .brand h1{font-size:10px;letter-spacing:0}
  .brand .sub,.tab .d{display:none}
  .tabs{padding:8px 0 8px 6px}
  .tab{padding:10px 6px;text-align:center}
  .tab .t{font-size:11px}
}
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <h1>One Stop Reconciliation</h1>
    <div class="sub">Finance reconciliation platform</div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Reconciliations" id="tabs"></nav>
</aside>

<main class="stage" id="stage"></main>

<dialog class="help" id="help" aria-labelledby="help-title">
  <div class="hh"><h2 id="help-title"></h2><button class="x" type="button" id="help-x" aria-label="Close">&times;</button></div>
  <div class="hb" id="help-body"></div>
</dialog>

<!-- Each reconciliation tool is embedded UNMODIFIED as a JSON string and mounted in its own iframe.
     Isolation guarantees the tool's logic, rules, styles and file handling behave exactly as standalone. -->
<script id="modules-data" type="application/json">/*__MODULES__*/</script>

<script>/*__HELP__*/</script>

<script>
(function(){
  var MODS = JSON.parse(document.getElementById('modules-data').textContent);
  var tabsEl = document.getElementById('tabs'), stage = document.getElementById('stage');
  var panes = {}, tabBtns = {};

  MODS.forEach(function(m){
    var b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.id = 'tab-' + m.id;
    b.setAttribute('role','tab'); b.setAttribute('aria-selected','false');
    b.setAttribute('aria-controls','pane-' + m.id);
    b.innerHTML = '<span class="t"></span><span class="d"></span>';
    b.querySelector('.t').textContent = m.label;
    b.querySelector('.d').textContent = m.desc;
    b.addEventListener('click', function(){ activate(m.id, true); });
    b.addEventListener('keydown', function(e){
      var i = MODS.findIndex(function(x){return x.id===m.id;}), n = null;
      if (e.key==='ArrowRight') n = MODS[(i+1)%MODS.length];
      else if (e.key==='ArrowLeft') n = MODS[(i-1+MODS.length)%MODS.length];
      if (n){ e.preventDefault(); activate(n.id, true); tabBtns[n.id].focus(); }
    });
    tabsEl.appendChild(b); tabBtns[m.id] = b;

    var p = document.createElement('section');
    p.className = 'pane'; p.id = 'pane-' + m.id;
    p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-' + m.id);
    stage.appendChild(p); panes[m.id] = p;
  });

  // The iframe is created the first time its tab is opened, then kept alive (hidden, not destroyed)
  // so uploaded files and results survive switching between tabs.
  var ICON_RULES = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="17"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/></svg>';
  var ICON_HOW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg>';

  var dlg = document.getElementById('help'), dTitle = document.getElementById('help-title'), dBody = document.getElementById('help-body');
  function esc(t){ return String(t).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function openHelp(m, kind){
    var sections = (HELP[m.id] || {})[kind] || [];
    dTitle.textContent = m.label + ' — ' + (kind === 'rules' ? 'Rules & parameters' : 'How to use');
    dBody.innerHTML = sections.map(function(x){ return '<h3>' + esc(x[0]) + '</h3>' + x[1]; }).join('') || '<p>No help available.</p>';
    dBody.scrollTop = 0;
    if (!dlg.open) dlg.showModal();
  }
  document.getElementById('help-x').addEventListener('click', function(){ dlg.close(); });
  dlg.addEventListener('click', function(e){ if (e.target === dlg) dlg.close(); });  // click on backdrop

  function toolbar(m){
    var bar = document.createElement('div'); bar.className = 'pbar';
    var t = document.createElement('div'); t.className = 'pt'; t.textContent = m.label + ' Reconciliation';
    bar.appendChild(t);
    [['rules', ICON_RULES, 'Rules & parameters', 'Rules and parameters used by this reconciliation'],
     ['how',   ICON_HOW,   'How to use',         'Step-by-step instructions']].forEach(function(d){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'ib';
      b.title = d[3]; b.setAttribute('aria-label', d[2] + ' — ' + m.label);
      b.innerHTML = d[1] + '<span>' + d[2] + '</span>';
      b.addEventListener('click', function(){ openHelp(m, d[0]); });
      bar.appendChild(b);
    });
    return bar;
  }

  function mount(m){
    var p = panes[m.id];
    if (p.firstChild) return;
    p.appendChild(toolbar(m));
    var ld = document.createElement('div'); ld.className = 'loading'; ld.textContent = 'Loading ' + m.label + '…';
    p.appendChild(ld);
    var f = document.createElement('iframe');
    f.title = m.label + ' reconciliation';
    f.addEventListener('load', function(){ if (ld.parentNode) ld.parentNode.removeChild(ld); });
    f.srcdoc = m.html;
    p.appendChild(f);
  }

  function activate(id, push){
    var m = MODS.find(function(x){return x.id===id;}) || MODS[0];
    MODS.forEach(function(x){
      var on = x.id === m.id;
      panes[x.id].classList.toggle('active', on);
      tabBtns[x.id].setAttribute('aria-selected', on ? 'true' : 'false');
      tabBtns[x.id].tabIndex = on ? 0 : -1;
    });
    mount(m);
    document.title = m.label + ' · One Stop Reconciliation';
    if (push && location.hash !== '#' + m.id) history.replaceState(null,'','#' + m.id);
  }

  window.addEventListener('hashchange', function(){ activate(location.hash.slice(1), false); });
  activate(location.hash.slice(1), false);
})();
</script>
</body>
</html>
